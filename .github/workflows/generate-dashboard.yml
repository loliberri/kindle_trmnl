name: Generate Kindle Dashboard

on:
  schedule:
    - cron: '59 22 * * *'
      timezone: 'Europe/Dublin'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kindle-dashboard
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and publish dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate dashboard PNG
        run: |
          mkdir -p docs
          python render.py --mode combo --out docs/kindle.png

      - name: Publish updated PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/kindle.png

          if git diff --cached --quiet; then
            echo "Dashboard PNG has not changed."
          else
            git commit -m "Update Kindle dashboard"
            git push
          fi
